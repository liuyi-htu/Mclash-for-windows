name: Build or Promote Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build a prerelease, or promote the current prerelease without rebuilding
        required: true
        default: build-prerelease
        type: choice
        options:
          - build-prerelease
          - promote-stable

permissions:
  contents: write

concurrency:
  group: mclash-release
  cancel-in-progress: false

jobs:
  windows-release:
    if: ${{ inputs.operation == 'build-prerelease' }}
    name: Build Windows prerelease
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: windows-service/go.mod
          cache-dependency-path: windows-service/go.sum

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Prepare prerelease version
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latestRelease = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $latestRelease) {
            throw "A published stable release is required before building a prerelease."
          }
          $latestTag = "$($latestRelease.tag_name)".Trim()
          if ($latestTag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
            throw "Latest stable release tag must use the vX.Y.Z format: $latestTag"
          }
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $patch = [int]$Matches[3] + 1
          $version = "$major.$minor.$patch"
          "MCLASH_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          "INSTALLER_NAME=Mclash-Windows-Setup-$version.exe" >> $env:GITHUB_ENV
          Write-Host "Latest stable release: $latestTag"
          Write-Host "Prerelease target: v$version"
          (Get-Content -LiteralPath "mclash/pubspec.yaml" -Raw) `
            -replace '(?m)^version:\s*.*$', "version: $version" |
            Set-Content -LiteralPath "mclash/pubspec.yaml" -Encoding utf8

      - name: Build installer
        shell: powershell
        run: ./scripts/build-windows.ps1

      - name: Create checksum
        shell: powershell
        run: |
          $installer = "installer/Output/$env:INSTALLER_NAME"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:INSTALLER_NAME" |
            Set-Content -LiteralPath "$installer.sha256" -Encoding ascii

      - name: Remove previous build of this prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to query existing releases."
          }
          $existing = $releases |
            Where-Object { $_.tag_name -eq $env:RELEASE_TAG } |
            Select-Object -First 1
          if (-not $existing) {
            Write-Host "No previous $env:RELEASE_TAG prerelease exists."
            exit 0
          }
          if (-not $existing.prerelease) {
            throw "Refusing to replace $env:RELEASE_TAG because it is not a prerelease."
          }
          gh release delete $env:RELEASE_TAG --yes --cleanup-tag
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to remove the previous $env:RELEASE_TAG prerelease."
          }

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mclash ${{ env.MCLASH_VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            installer/Output/${{ env.INSTALLER_NAME }}
            installer/Output/${{ env.INSTALLER_NAME }}.sha256

  promote-stable:
    if: ${{ inputs.operation == 'promote-stable' }}
    name: Promote prerelease to stable
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Promote the next version
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latestRelease = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $latestRelease) {
            throw "A published stable release is required before promoting a prerelease."
          }
          $latestTag = "$($latestRelease.tag_name)".Trim()
          if ($latestTag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
            throw "Latest stable release tag must use the vX.Y.Z format: $latestTag"
          }
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $patch = [int]$Matches[3] + 1
          $targetTag = "v$major.$minor.$patch"

          $targetRelease = gh release view $targetTag `
            --json isDraft,isPrerelease,url |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $targetRelease) {
            throw "Prerelease $targetTag does not exist. Build it before promoting."
          }
          if ($targetRelease.isDraft -or -not $targetRelease.isPrerelease) {
            throw "Refusing to promote $targetTag because it is not a published prerelease."
          }

          gh release edit $targetTag --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to promote $targetTag."
          }
          Write-Host "Promoted $targetTag to the latest stable release."
          Write-Host $targetRelease.url
